[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lite"
version = "0.1.0"
description = "一个轻量级、可交互的 AI Agent 示例项目（pi agent 的 Python 复刻）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agent-lite = "coding_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["ai*", "agent_core*", "coding_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
